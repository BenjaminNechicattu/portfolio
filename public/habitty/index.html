      html,

      @font-face {
        font-family: 'Ionicons';
        src: url('/habitty/assets/node_modules/@expo/vector-icons/build/vendor/react-native-vector-icons/Fonts/Ionicons.b4eb097d35f44ed943676fd56f6bdc51.ttf') format('truetype');
        font-style: normal;

      #install-habitty {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 2147483647;

        background: #0f172a;

      #install-habitty-tip {
        position: fixed;

<link rel="icon" href="./favicon.ico"/></head>
  <body>
    <div id="root"></div>
    <button id="install-habitty" type="button">Install Habitty</button>
    <div id="install-habitty-tip">Install Habitty: open browser menu and choose "Add to Home screen".</div>
  <script src="./_expo/static/js/web/index-f0422effbaa12e4d015856ae12c25e2f.js" defer></script>
  <script>
    (() => {
      let deferredPrompt = null;
      const installButton = document.getElementById('install-habitty');
      const installTip = document.getElementById('install-habitty-tip');

      if (!installButton || !installTip) return;

      window.addEventListener('beforeinstallprompt', (event) => {
        event.preventDefault();
        deferredPrompt = event;
        installButton.style.display = 'inline-flex';
      });

      installButton.addEventListener('click', async () => {
        if (!deferredPrompt) return;
        deferredPrompt.prompt();
        await deferredPrompt.userChoice;
        deferredPrompt = null;
        installButton.style.display = 'none';
      });

      window.addEventListener('appinstalled', () => {
        installButton.style.display = 'none';
        installTip.style.display = 'none';
      });

      const isStandalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
      const isAppleMobile = /iphone|ipad|ipod/i.test(navigator.userAgent);
      if (isAppleMobile && !isStandalone) {
        installTip.style.display = 'block';
      }
    })();
  </script>
</body>
</html>
